<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de la recette - Chef's Corner</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Chef's Corner</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="catalogue.html">Catalogue</a></li>
                    <li><a href="login.html">Connexion</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="recipe-detail">
        <div class="recipe-header">
            <div class="recipe-image">
                <img id="recipe-image" src="" alt="Image de la recette">
            </div>
            <div class="recipe-info">
                <h1 id="recipe-title">Nom de la recette</h1>
                <div class="meta">
                    <span id="recipe-time"><i class="far fa-clock"></i> Temps de préparation</span>
                    <span id="recipe-servings"><i class="fas fa-users"></i> Nombre de personnes</span>
                    <span id="recipe-country"><i class="fas fa-globe"></i> Pays</span>
                    <span id="recipe-category"><i class="fas fa-tag"></i> Catégorie</span>
                </div>
            </div>
        </div>

        <div class="recipe-content">
            <div class="ingredients">
                <h2>Ingrédients</h2>
                <ul id="ingredients-list">
                    <!-- Les ingrédients seront chargés ici via JavaScript -->
                </ul>
            </div>

            <div class="utensils">
                <h2>Ustensiles</h2>
                <ul id="utensils-list">
                    <!-- Les ustensiles seront chargés ici via JavaScript -->
                </ul>
            </div>

            <div class="steps">
                <h2>Étapes de préparation</h2>
                <ol id="steps-list">
                    <!-- Les étapes seront chargées ici via JavaScript -->
                </ol>
            </div>
        </div>

        
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Chef's Corner. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
